<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07090f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="定時" />
    <meta
      name="description"
      content="飛んでくる「ちょっといい？」をスワイプでかわして、定時退社を死守するエンドレスミニゲーム。"
    />
    <title>定時</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="sprites/player.png" as="image" />
    <link rel="preload" href="fonts/dela-gothic-one.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/mplus-rounded-bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view" width="390" height="844" aria-hidden="true"></canvas>
      <div id="vignette" aria-hidden="true"></div>
      <div id="grain" aria-hidden="true"></div>

      <div class="frame">
        <header id="hud" hidden>
          <div class="score-wrap">
            <span class="kicker" id="score-kicker">防衛</span>
            <p class="score-row">
              <strong id="hud-score">0</strong><span class="unit">分</span>
            </p>
            <span id="hud-combo"></span>
          </div>
          <div id="clock" aria-hidden="true">
            <div class="face">
              <i class="hand hour" id="hand-hour"></i>
              <i class="hand min" id="hand-min"></i>
              <b class="cap"></b>
            </div>
            <span id="clock-time">17:00</span>
          </div>
          <div class="best-wrap">
            <span class="kicker">記録</span>
            <p class="score-row small">
              <strong id="hud-best">0</strong><span class="unit">分</span>
            </p>
          </div>
        </header>

        <p id="banner" hidden></p>
        <p id="praise" aria-hidden="true"></p>
        <p id="hint" hidden>左右にスワイプ</p>

        <section id="title-screen">
          <div class="title-top">
            <p class="eyebrow">エンドレス回避</p>
            <h1 class="wordmark">
              <span class="ghost" aria-hidden="true">定時</span>
              定時
            </h1>
            <p class="instruct">スワイプでかわせ</p>
            <p class="flavor">飛んでくる「ちょっといい？」をかわして、定時退社を死守する。</p>
          </div>
          <div class="title-bottom">
            <p class="title-best" id="title-best" hidden>記録 <strong>0</strong>分</p>
            <button id="start" class="cta" type="button">帰る</button>
            <p class="desktop-hint">キーボードの左右でも動けます</p>
          </div>
        </section>

        <section id="pause-screen" hidden>
          <div class="pause-card">
            <p class="eyebrow">一時停止</p>
            <button id="resume" class="cta" type="button">再開する</button>
          </div>
        </section>

        <section id="gameover" hidden>
          <article class="timecard">
            <header class="card-head">
              <span>勤怠カード</span>
              <span class="card-brand">定時</span>
            </header>
            <div class="hanko" aria-hidden="true"><span>残業</span></div>
            <h2 id="over-title">残業確定</h2>
            <p class="card-label">防衛時間</p>
            <p class="card-score"><span id="over-score">0</span><small>分</small></p>
            <p class="card-time" id="over-time">17:00 で捕捉</p>
            <p class="card-best">
              記録 <span id="over-best">0</span>分
              <em id="new-badge" hidden>更新</em>
            </p>
            <p class="card-joke" id="joke"></p>
            <button id="retry" class="cta" type="button">もう一度帰る</button>
            <button id="share" class="ghost" type="button">戦績を送る</button>
          </article>
        </section>

        <button id="mute" type="button" aria-pressed="false" aria-label="音を消す">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              id="mute-icon"
              fill="currentColor"
              d="M3 9.5v5h3.2L11 18.8V5.2L6.2 9.5H3zm12.2 2.5a3.2 3.2 0 0 0-1.7-2.8v5.6a3.2 3.2 0 0 0 1.7-2.8zM13.5 6.1v1.7a5 5 0 0 1 0 8.4v1.7a6.7 6.7 0 0 0 0-11.8z"
            />
          </svg>
        </button>

        <p id="toast" hidden role="status"></p>
        <p id="live" class="sr" aria-live="polite"></p>
      </div>
    </div>
    <script src="js/game.js"></script>
  </body>
</html>
